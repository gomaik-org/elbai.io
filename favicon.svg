<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Square with Gradient Border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#030712" stroke="url(#faviconGrad)" stroke-width="3"/>
  
  <!-- Subtle Internal Grid Pattern -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#1e293b" stroke-width="1" opacity="0.4"/>
  <line x1="32" y1="2" x2="32" y2="62" stroke="#1e293b" stroke-width="1" opacity="0.4"/>

  <!-- Iconic 'AI' Typography -->
  <text x="32" y="44" 
        font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Fira Code', monospace, sans-serif" 
        font-size="30" 
        font-weight="900" 
        text-anchor="middle" 
        fill="#22d3ee" 
        letter-spacing="1"
        filter="url(#glow)">AI</text>
  
  <!-- Micro Pulsing Dot on Top of I -->
  <circle cx="43" cy="21" r="2.5" fill="#f43f5e"/>
</svg>
