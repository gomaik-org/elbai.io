name: Gemini Sentinel Security & Triage Guard

on:
  workflow_run:
    workflows: ["Build & Deploy to Cloudflare Pages", "CI"]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  triage:
    name: Autonomous Gemini Triage
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' || contains(github.event.comment.body, '@gemini') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gemini AI Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Gemini Sentinel Guard initialized. Listening for workflow triage requests."
          # If GEMINI_API_KEY is configured, trigger autonomous triage engine
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY detected. Ready for autonomous triage & security remediation."
          else
            echo "Awaiting GEMINI_API_KEY repository secret."
          fi
